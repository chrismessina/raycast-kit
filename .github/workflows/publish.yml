name: Publish Package

# Mirrors chrismessina/raycast-logger's publish.yml — same trigger, same idempotency
# guard — so both packages release the same way. Two additions: the test suite gates
# the publish, and the release tag must agree with package.json.
#
# Publishing is deliberately tied to a GitHub Release, NOT to a push to main. A merged
# docs commit should not mint an npm version, and a release is an explicit, reversible-
# up-to-that-point decision.

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      # Gate on the same checks that run locally. `npm publish` also fires these via
      # prepublishOnly, but running them here fails the job with a readable log
      # instead of a publish that dies mid-step.
      - run: npm run build
      - run: npm test

      # A tag that disagrees with package.json is how the wrong version gets published.
      # Compare them before touching the registry. Accepts `v0.1.1` or `0.1.1`.
      - name: Verify tag matches package.json
        run: |
          PKG="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Release tag '$TAG' does not match package.json version '$PKG'."
            echo "Bump package.json (npm version) or retag the release, then retry."
            exit 1
          fi
          echo "version $PKG matches tag $TAG"

      - name: Publish to npm
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          NAME="$(node -p "require('./package.json').name")"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already published — skipping."
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
